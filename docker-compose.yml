services:
  postgres:
    image: postgres:16-alpine
    container_name: cleanquote_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me_local_only
      POSTGRES_DB: cleanquote
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
